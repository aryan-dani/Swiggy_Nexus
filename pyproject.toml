[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["frontend/", ".venv/", "__pycache__/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[project]
name = "swiggy-nexus"
version = "0.2.0"
description = "Agentic AI demo for Swiggy MCP verticals"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "groq>=0.4.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langgraph-checkpoint-sqlite>=1.0.0,<3.0.0",
    "apscheduler>=3.10.0",
    "tzdata>=2024.1",
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "aiohttp>=3.10.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

