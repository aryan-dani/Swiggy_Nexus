# Render Blueprint — connect this repo and click "Apply".
# Docs: docs/deploy-render.md

services:
  - type: web
    name: swiggy-nexus-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000,https://swiggy-nexus.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.(onrender|vercel)\.app
      - key: FRONTEND_ORIGIN
        value: https://swiggy-nexus.vercel.app
      # Optional Live MCP (add as secret in dashboard — do not commit tokens):
      # - key: SWIGGY_OAUTH_TOKEN
      # - key: USE_MOCK_MCP
      #   value: "true"

  - type: web
    name: swiggy-nexus-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: swiggy-nexus-api
          type: web
          property: host
      - key: NEXT_PUBLIC_GROQ_ENABLED
        value: "true"
